name: Build and publish to Blob Builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Publish to Blob Builds
        uses: WalshyDev/blob-builds/gh-action@main
        with:
          project: G.O.A.T. Industries
          releaseChannel: Dev
          apiToken: ${{ secrets.BLOB_BUILD_API_TOKEN }}
          file: ./target/G.O.A.T. Industries.jar
          releaseNotes: ${{ github.event.head_commit.message || 'Manual build from GitHub Actions' }}
