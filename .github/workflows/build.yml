name: Build and publish to Blob Builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Create Blob Builds project if needed
        env:
          BLOB_BUILD_API_TOKEN: ${{ secrets.BLOB_BUILD_API_TOKEN }}
        run: |
          PROJECT_NAME="GOAT-Industries"
          PROJECT_PATH=$(printf '%s' "$PROJECT_NAME" | jq -sRr @uri)
          PROJECTS=$(curl --fail --silent --show-error https://blob.build/api/projects)

          if printf '%s' "$PROJECTS" | jq -e --arg name "$PROJECT_NAME" '.data[]? | select(.name == $name)' >/dev/null; then
            echo "Blob Builds project already exists."
          else
            echo "Creating Blob Builds project..."
            RESPONSE=$(curl --silent --show-error --write-out '\nHTTP_STATUS:%{http_code}' \
              -X POST "https://blob.build/api/projects/$PROJECT_PATH/new" \
              -H "Authorization: Bearer $BLOB_BUILD_API_TOKEN" \
              -H "Content-Type: application/json" \
              -H "User-Agent: GOAT-Industries-GitHub-Actions" \
              -d '{
                "name": "GOAT-Industries",
                "description": "The ultimate Slimefun addon",
                "repoLink": "https://github.com/Boomer-1/G.O.A.T.-Industries.git",
                "releaseChannels": [
                  {
                    "name": "Dev",
                    "supportedVersions": "1.21.x",
                    "fileNaming": "$project.jar"
                  }
                ]
              }')
            HTTP_STATUS=$(printf '%s' "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
            RESPONSE_BODY=$(printf '%s' "$RESPONSE" | sed '$d')
            echo "Blob Builds project-creation response (HTTP $HTTP_STATUS):"
            printf '%s\n' "$RESPONSE_BODY"
            case "$HTTP_STATUS" in
              2??) ;;
              *) echo "Blob Builds project creation failed."; exit 1 ;;
            esac
          fi

      - name: Update existing Blob Builds project and Dev channel metadata
        env:
          BLOB_BUILD_API_TOKEN: ${{ secrets.BLOB_BUILD_API_TOKEN }}
        run: |
          PROJECT_PATH=$(printf '%s' "GOAT-Industries" | jq -sRr @uri)

          echo "Linking the existing Blob Builds project to GitHub..."
          PROJECT_RESPONSE=$(curl --silent --show-error --write-out '\nHTTP_STATUS:%{http_code}' \
            -X PATCH "https://blob.build/api/projects/$PROJECT_PATH" \
            -H "Authorization: Bearer $BLOB_BUILD_API_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GOAT-Industries-GitHub-Actions" \
            -d '{
              "name": "GOAT-Industries",
              "description": "The ultimate Slimefun addon",
              "repoLink": "https://github.com/Boomer-1/G.O.A.T.-Industries.git"
            }')
          PROJECT_STATUS=$(printf '%s' "$PROJECT_RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          PROJECT_BODY=$(printf '%s' "$PROJECT_RESPONSE" | sed '$d')
          echo "Blob Builds project update response (HTTP $PROJECT_STATUS):"
          printf '%s\\n' "$PROJECT_BODY"
          case "$PROJECT_STATUS" in
            2??) ;;
            *) echo "Blob Builds project update failed."; exit 1 ;;
          esac

          echo "Setting the Dev channel supported versions to 1.21.x..."
          CHANNEL_RESPONSE=$(curl --silent --show-error --write-out '\nHTTP_STATUS:%{http_code}' \
            -X PATCH "https://blob.build/api/projects/$PROJECT_PATH/Dev" \
            -H "Authorization: Bearer $BLOB_BUILD_API_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GOAT-Industries-GitHub-Actions" \
            -d '{"supportedVersions":"1.21.x"}')
          CHANNEL_STATUS=$(printf '%s' "$CHANNEL_RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          CHANNEL_BODY=$(printf '%s' "$CHANNEL_RESPONSE" | sed '$d')
          echo "Blob Builds Dev channel update response (HTTP $CHANNEL_STATUS):"
          printf '%s\\n' "$CHANNEL_BODY"
          case "$CHANNEL_STATUS" in
            2??) ;;
            *) echo "Blob Builds Dev channel update failed."; exit 1 ;;
          esac

      - name: Publish to Blob Builds
        env:
          BLOB_BUILD_API_TOKEN: ${{ secrets.BLOB_BUILD_API_TOKEN }}
        run: |
          JAR="./target/G.O.A.T. Industries.jar"
          CHECKSUM=$(sha256sum "$JAR" | awk '{print $1}')
          METADATA=$(jq -n \
            --arg checksum "$CHECKSUM" \
            --arg supportedVersions "1.21.x" \
            --arg releaseNotes "${{ github.event.head_commit.message || 'Manual build from GitHub Actions' }}" \
            --arg commitHash "${{ github.sha }}" \
            '{checksum: $checksum, supportedVersions: $supportedVersions, releaseNotes: $releaseNotes, commitHash: $commitHash}')

          RESPONSE=$(curl --silent --show-error --write-out '\nHTTP_STATUS:%{http_code}' \
            -X POST "https://blob.build/api/projects/GOAT-Industries/Dev/upload" \
            -H "Authorization: Bearer $BLOB_BUILD_API_TOKEN" \
            -H "User-Agent: GOAT-Industries-GitHub-Actions" \
            --form "file=@$JAR" \
            --form-string "metadata=$METADATA")
          HTTP_STATUS=$(printf '%s' "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          RESPONSE_BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          echo "Blob Builds upload response (HTTP $HTTP_STATUS):"
          printf '%s\n' "$RESPONSE_BODY"
          case "$HTTP_STATUS" in
            2??) ;;
            *) echo "Blob Builds upload failed."; exit 1 ;;
          esac
